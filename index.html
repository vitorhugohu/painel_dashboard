    <style>
    /* mantém uma variação menor, mas ainda responsiva */
    /* imagem totalmente responsiva (sem quebrar o bootstrap) */
    .img-fluid {
        max-width: 100%;
        height: auto;
        border-radius: 20px;
        margin-top: 20px;
    }

    /* versão menor (caso use depois) */
    .img-mobile {
        max-width: 120px;
        height: auto;
        border-radius: 10px;
        margin-top: 20px;
    }

    /* texto adaptável */
    .textoMobile {
        font-size: clamp(14px, 2.5vw, 18px);
        text-align: center;
        padding: 0 15px;
    }

    /* spinner levemente adaptável */
    .spinner-border {
        width: clamp(2rem, 5vw, 3rem);
        height: clamp(2rem, 5vw, 3rem);
    }

    /* centralização moderna */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        flex-direction: column;
        text-align: center;
        padding: 10px;
    }
    </style>
</head>
